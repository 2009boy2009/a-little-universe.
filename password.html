
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Universe ♡</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 22px;
  font-family: Georgia, serif;
  text-align: center;
  color: #fff0f6;
  background:
    radial-gradient(ellipse at top, #633653, transparent 55%),
    linear-gradient(145deg, #080b20, #29152d, #080b20);
  overflow: hidden;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 20% 20%, white, transparent),
    radial-gradient(2px 2px at 80% 30%, #ffc7e1, transparent),
    radial-gradient(2px 2px at 40% 70%, white, transparent),
    radial-gradient(2px 2px at 70% 85%, #ffc7e1, transparent);
  background-size: 180px 160px;
}

.card {
  position: relative;
  width: 100%;
  max-width: 390px;
  padding: 38px 26px;
  border: 1px solid #d98bb477;
  border-radius: 28px;
  background: #130e20dc;
  box-shadow: 0 0 50px #d45b9b25;
  backdrop-filter: blur(10px);
}

.moon {
  position: fixed;
  top: 7%;
  right: 10%;
  font-size: 45px;
  color: #ffd4e5;
}

h1 {
  font-size: 32px;
  font-weight: normal;
  font-style: italic;
}

p { color: #e6c9dc; line-height: 1.7; }

input, button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border-radius: 13px;
  font-size: 16px;
}

input {
  border: 1px solid #d98bb4;
  background: #ffffff08;
  color: white;
  text-align: center;
  outline: none;
}

input::placeholder { color: #c7a4ba; }

button {
  border: none;
  background: linear-gradient(120deg, #c66f9b, #e3a0bd);
  color: #281326;
  cursor: pointer;
}

#error { color: #ffb9d4; font-size: 14px; }

.footer { margin-top: 25px; color: #dca9c6; }
</style>
</head>

<body>
<div class="stars"></div>
<div class="moon">☾</div>

<main class="card">
  <div>♡ ─── ✧ ─── ♡</div>
  <h1>A little universe ✨</h1>
  <p>Some things are meant for<br>the right person ♡</p>

  <form id="login">
    <input
      id="pass"
      type="password"
      placeholder="Enter the password ♡"
      autocomplete="off"
      required
    >
    <button type="submit">Unlock ♡</button>
    <p id="error" aria-live="polite"></p>
  </form>

  <div class="footer">Written in the stars ♡</div>
</main>

<script>
document.getElementById("login").addEventListener("submit", function(e) {
  e.preventDefault();

  if (document.getElementById("pass").value === "Muskan") {
    window.location.href = "./index.html";
  } else {
    document.getElementById("error").textContent =
      "Not quite! Try again, ♡";
    document.getElementById("pass").value = "";
  }
});
</script>
</body>
</html>
